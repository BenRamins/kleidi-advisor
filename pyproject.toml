[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kleidi-advisor"
version = "0.1.0"
description = "Diagnose, measure, and fix the KleidiAI kernel-path miss in GGUF models on Arm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
kleidi-advisor = "kleidi_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
