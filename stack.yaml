# stack.yaml — tech-stack & authoritative-doc manifest  (Otto memory member 5)
#
# Project-owned + version-pinned. Otto is the source of truth for WHICH docs/versions are canonical;
# the FETCH is pluggable (context7 MCP / WebFetch / offline snapshot) — tool-agnostic (D4).
#   - `source-ground` resolves a pin here -> its docs -> fetches against THAT version.
#   - `evaluate-alternatives` reads these pins when comparing packages.
#   - `/otto-sync` can refresh versions and flag newer majors.
#
# eco values: npm | pub.dev | crates | nuget | pypi | go | maven ...
# Optional per entry: pin_reason, channel, context7_id.

runtimes:
  node:    { version: "20.11 LTS",  docs: "https://nodejs.org/docs/latest-v20.x/api/" }
  flutter: { version: "3.19 stable", docs: "https://api.flutter.dev/" }
  # dotnet: { version: "8.0", docs: "https://learn.microsoft.com/dotnet/" }

frameworks:
  react: { version: "18.2", docs: "https://react.dev/reference/react", context7_id: "/facebook/react" }
  # riverpod: { version: "2.5", docs: "https://riverpod.dev", context7_id: "/rrousselgit/riverpod" }

packages:
  - { name: drizzle-orm, eco: npm, version: "0.30.x", docs: "https://orm.drizzle.team/docs", changelog: "https://github.com/drizzle-team/drizzle-orm/releases" }
  # - { name: riverpod, eco: pub.dev, version: "2.5.x", docs: "https://pub.dev/packages/riverpod" }

# workspace efforts: a workspace-level stack.yaml governs deps shared across repos;
# per-repo stack.yaml files cover repo-specific deps.
